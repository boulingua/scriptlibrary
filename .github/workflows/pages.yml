name: library
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.159.2'
          extended: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: pip install -r requirements.txt
      - run: python3 scripts/verify.py
      - run: hugo --minify --gc --panicOnWarning
      - run: python3 scripts/check_links.py public
      - run: npx playwright install --with-deps chromium
      - name: Exercise the built reader
        run: |
          mkdir -p build/preview
          ln -s "$PWD/public" build/preview/scriptlibrary
          python3 -m http.server 1317 --bind 127.0.0.1 --directory build/preview > /tmp/library-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid"' EXIT
          python3 - <<'PYCODE'
          import time, urllib.request
          for attempt in range(50):
              try:
                  urllib.request.urlopen('http://127.0.0.1:1317/scriptlibrary/', timeout=1)
                  break
              except OSError:
                  time.sleep(.2)
          else:
              raise SystemExit('Preview server did not start')
          PYCODE
          LIBRARY_URL=http://127.0.0.1:1317/scriptlibrary/ npm run test:browser
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
